<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정삭 장비 주간 계획 취합 시스템</title>
    <!-- Google Fonts for Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* CRITICAL STICKY RULES - INLINE TO BEAT BROWSER CACHE */
        .table-scroll-wrapper {
            width: 100%;
            /* NO overflow properties here, so the whole page scrolls */
            overflow: visible !important;
        }

        thead th {
            position: -webkit-sticky !important;
            position: sticky !important;
            top: 0 !important;
            z-index: 9999 !important;
            background-color: #F8FAFC !important;
            background-clip: padding-box !important;
            box-shadow: inset 0 -1px 0 var(--border-color), 0 2px 4px -2px rgba(0, 0, 0, 0.15) !important;
        }
    </style>
  <script type="module" crossorigin src="/assets/main-vZXLSEn7.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/main-Dj1xM47w.css">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>주간 정삭 계획 현황</h1>
            <div class="week-picker-container"
                style="position: relative; display: inline-flex; align-items: center; gap: 10px;">
                <label>기간 선택:</label>
                <div class="week-picker-wrapper" style="position: relative;">
                    <!-- Custom text display -->
                    <div id="weekDisplay" class="week-display"
                        style="padding: 0.6rem 1rem; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main); font-weight: 500; cursor: pointer;">
                        로딩중...
                    </div>
                    <!-- Invisible native week input -->
                    <input type="date" id="weekPicker" class="week-picker">
                </div>
                <!-- Moved Manager Filter here -->
                <div class="filter-group" style="margin-left: 10px;">
                    <label for="managerFilter" style="font-weight: 600; font-size: 0.9rem;">👤 담당자:</label>
                    <select id="managerFilter"
                        style="padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border-color); cursor: pointer; font-size: 0.9rem;">
                        <option value="">전체 항목</option>
                    </select>
                </div>
            </div>
    </div>
    <p>각 장비별 계획을 입력하고 [통합 화면]에서 전체 현황을 확인하세요.</p>
    </header>

    <nav class="tabs-container">
        <ul id="equipmentTabs" class="tabs">
            <!-- Tabs will be injected here dynamically -->
        </ul>
    </nav>

    <main>
        <!-- Content for specific equipment -->
        <section id="planEditor" class="tab-content active">
            <div class="editor-header">
                <h2 id="currentEquipmentTitle">장비명 로딩중...</h2>
            </div>

            <!-- Phase 18: Holiday Toggle UI -->
            <div class="holiday-section">
                <div class="holiday-label">📅 장비 휴무일 설정 (휴무) :</div>
                <div class="holiday-toggles" id="holidayToggles">
                    <button class="holiday-btn" data-day="fri">금</button>
                    <button class="holiday-btn" data-day="sat">토</button>
                    <button class="holiday-btn" data-day="sun">일</button>
                    <button class="holiday-btn" data-day="mon">월</button>
                    <button class="holiday-btn" data-day="tue">화</button>
                    <button class="holiday-btn" data-day="wed">수</button>
                    <button class="holiday-btn" data-day="thu">목</button>
                </div>
                <div style="font-size: 0.85rem; color: #666; margin-left: auto;">* 휴무로 선택된 요일은 계획 입력이 차단됩니다.</div>
            </div>

            <div class="table-card">
                <div class="table-scroll-wrapper">
                    <table id="planTable">
                        <thead>
                            <tr>
                                <th>NO</th>
                                <th>담당자</th>
                                <th>기종</th>
                                <th>품명</th>
                                <th>품번</th>
                                <th id="thFri">금</th>
                                <th id="thSat">토</th>
                                <th id="thSun">일</th>
                                <th id="thMon">월</th>
                                <th id="thTue">화</th>
                                <th id="thWed">수</th>
                                <th id="thThu">목</th>
                                <th>작업</th>
                            </tr>
                        </thead>
                        <tbody id="planTableBody">
                            <!-- Rows injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="actions">
                <button class="btn btn-secondary" id="addRowBtn">+ 행 추가</button>
                <button class="btn btn-primary" id="saveBtn">✓ 계획 저장하기</button>
            </div>
        </section>

        <!-- Content for Consolidated View -->
        <section id="consolidatedView" class="tab-content">
            <div class="editor-header">
                <h2>통합 화면 : 전체 주간 정삭 계획 및 실적</h2>
                <div class="filter-group" style="display: flex; gap: 0.5rem; align-items: center;">
                    <button class="btn btn-warning" id="editModeBtn">✏️ 수정 모드</button>
                    <button class="btn btn-primary hidden" id="saveConsolidatedBtn">💾 변경사항 저장</button>
                    <button class="btn btn-primary" id="saveActualsBtn">💾 실적 저장</button>
                    <button class="btn btn-success" id="exportExcelBtn">📥 엑셀 추출</button>
                    <button class="btn" id="addUnscheduledBtn" style="background-color: #FFF7ED; color: #EA580C; border: 1px solid #FFEDD5; font-weight: 700; height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 12px; cursor: pointer; border-radius: 6px; font-size: 0.9rem; transition: all 0.2s;" onmouseover="this.style.backgroundColor='#FFEAD2'" onmouseout="this.style.backgroundColor='#FFF7ED'">➕ 계획 외 실적 등록</button>
                    <button class="btn btn-secondary" id="refreshConsolidatedBtn">🔄 새로고침</button>
                </div>
            </div>
            <div class="table-card">
                <div class="table-scroll-wrapper">
                    <table id="consolidatedTable">
                        <thead>
                            <tr>
                                <th style="width: 9%;">장비 (W/C)</th>
                                <th style="width: 4%;">담당자</th>
                                <th style="width: 5%;">기종</th>
                                <th style="width: 11%;">품명</th>
                                <th style="width: 13.5%;">품번</th>
                                <th style="width: 4.5%;">표준시간</th>
                                <th style="width: 3%;">구분</th>
                                <th id="thConsFri" style="width: 7.14%;">금</th>
                                <th id="thConsSat" style="width: 7.14%;">토</th>
                                <th id="thConsSun" style="width: 7.14%;">일</th>
                                <th id="thConsMon" style="width: 7.14%;">월</th>
                                <th id="thConsTue" style="width: 7.14%;">화</th>
                                <th id="thConsWed" style="width: 7.14%;">수</th>
                                <th id="thConsThu" style="width: 7.14%;">목</th>
                            </tr>
                        </thead>
                        <tbody id="consolidatedTableBody">
                            <!-- Rows injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- Unscheduled Plan Modal -->
    <div id="unscheduledModal" class="modal-overlay hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s ease;">
        <div class="modal-content" style="background: white; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); width: 100%; max-width: 480px; padding: 1.75rem; border: 1px solid #E2E8F0; transform: translateY(20px); transition: transform 0.25s ease;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; border-bottom: 1px solid #F1F5F9; padding-bottom: 0.75rem;">
                <h3 style="font-size: 1.15rem; font-weight: 700; color: #0F172A; display: flex; align-items: center; gap: 6px; margin: 0;">
                    <span style="background: #FFEAE0; color: #EA580C; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 0.95rem;">➕</span>
                    계획 외 실적 (비계획 생산) 등록
                </h3>
                <button id="closeUnscheduledModalBtn" style="background: none; border: none; font-size: 1.5rem; color: #94A3B8; cursor: pointer; line-height: 1; transition: color 0.15s;" onmouseover="this.style.color='#64748B'" onmouseout="this.style.color='#94A3B8'">&times;</button>
            </div>
            
            <form id="unscheduledForm" style="display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #475569; margin-bottom: 0.35rem;">* 장비 (W/C) 선택</label>
                    <select id="unschEquipment" style="width: 100%; height: 38px; border: 1px solid #CBD5E1; border-radius: 6px; padding: 0 10px; font-size: 0.9rem; font-family: inherit;" required>
                        <option value="">장비를 선택하세요</option>
                        <option value="HSP6300">HSP6300</option>
                        <option value="HSP8000 #1">HSP8000 #1</option>
                        <option value="HSP8000 #2">HSP8000 #2</option>
                        <option value="HM2J">HM2J</option>
                        <option value="AH2J">AH2J</option>
                        <option value="Y10T">Y10T</option>
                        <option value="Y15T">Y15T</option>
                        <option value="YBM1530">YBM1530</option>
                    </select>
                </div>

                <div>
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #475569; margin-bottom: 0.35rem;">* 품번 입력</label>
                    <div style="display: flex; gap: 0.5rem;">
                        <input type="text" id="unschPartNo" placeholder="예: 160601-01685E" style="flex: 1; height: 38px; border: 1px solid #CBD5E1; border-radius: 6px; padding: 0 10px; font-size: 0.9rem; font-family: inherit;" required>
                        <button type="button" id="queryStdTimeBtn" style="background-color: #1E3A8A; color: white; border: none; padding: 0 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: background 0.15s; white-space: nowrap;" onmouseover="this.style.backgroundColor='#1E40AF'" onmouseout="this.style.backgroundColor='#1E3A8A'">마스터 조회</button>
                    </div>
                </div>

                <div id="unschPartDetails" style="background-color: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; padding: 0.75rem; font-size: 0.85rem; color: #475569; display: flex; flex-direction: column; gap: 0.35rem;">
                    <div>• 품명: <span id="unschPartNameText" style="font-weight: 600; color: #0F172A;">-</span></div>
                    <div>• 표준시간: <span id="unschStdTimeText" style="font-weight: 700; color: #1E3A8A;">-</span></div>
                </div>

                <div>
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #475569; margin-bottom: 0.35rem;">기종 입력 (선택사항)</label>
                    <input type="text" id="unschModel" placeholder="예: SMX2600" style="width: 100%; height: 38px; border: 1px solid #CBD5E1; border-radius: 6px; padding: 0 10px; font-size: 0.9rem; font-family: inherit;">
                </div>

                <div>
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #475569; margin-bottom: 0.35rem;">* 담당자 입력</label>
                    <input type="text" id="unschManager" placeholder="예: 양태영" style="width: 100%; height: 38px; border: 1px solid #CBD5E1; border-radius: 6px; padding: 0 10px; font-size: 0.9rem; font-family: inherit;" required>
                </div>

                <div style="display: flex; gap: 0.75rem; margin-top: 0.5rem;">
                    <button type="button" id="cancelUnscheduledBtn" style="flex: 1; height: 38px; background: #F1F5F9; border: 1px solid #E2E8F0; border-radius: 6px; font-weight: 600; color: #475569; cursor: pointer; transition: background 0.15s;" onmouseover="this.style.backgroundColor='#E2E8F0'" onmouseout="this.style.backgroundColor='#F1F5F9'">취소</button>
                    <button type="submit" style="flex: 1; height: 38px; background: #EA580C; border: none; border-radius: 6px; font-weight: 600; color: white; cursor: pointer; transition: background 0.15s;" onmouseover="this.style.backgroundColor='#C2410C'" onmouseout="this.style.backgroundColor='#EA580C'">등록 및 저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">저장되었습니다.</div>
    </div>

    <!-- SheetJS for Excel Export (Local Fallback for Intranet) -->
    <script src="/js/xlsx.full.min.js"></script>
</body>

</html>
