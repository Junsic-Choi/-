<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Header Test</title>
    <style>
        body {
            font-family: sans-serif;
            background: #e2e8f0;
            padding: 20px;
        }

        .table-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        .table-scroll-wrapper {
            height: 300px;
            overflow-y: auto;
            border: 2px solid blue;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }

        thead th {
            position: sticky;
            top: 0;
            background: yellow;
            z-index: 10;
        }
    </style>
</head>

<body>
    <div class="table-card">
        <div class="table-scroll-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Header 1</th>
                        <th>Header 2</th>

                    </tr>
