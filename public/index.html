<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정삭 장비 주간 계획 취합 시스템</title>
    <!-- Google Fonts for Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=5">
    <style>
        /* CRITICAL STICKY RULES - INLINE TO BEAT BROWSER CACHE */
        .table-scroll-wrapper {
            width: 100%;
            height: 65vh;
            /* INTERNAL SCROLL HEIGHT */
            overflow: auto !important;
            /* Enable internal scrolling */
            border-bottom: 2px solid var(--primary);
        }

        thead th {
            position: -webkit-sticky !important;
            position: sticky !important;
            top: 0 !important;
            z-index: 9999 !important;
            background-color: #F8FAFC !important;
            background-clip: padding-box !important;
            box-shadow: inset 0 -1px 0 var(--border-color), 0 2px 4px -2px rgba(0, 0, 0, 0.15) !important;
            text-align: center !important;
            /* ONLY CENTERING THE HEADER TEXT */
        }
    </style>
</head>

<body>
    <div class="app-container">
        <header>
        <div class="user-actions" style="position: absolute; top: 1rem; right: 1rem; display: flex; gap: 0.5rem; z-index: 10000;">
            <button onclick="viewActivityLogs()" class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.8rem; opacity: 0.8; background-color: #E67E22;">활동 로그 확인</button>
            <button onclick="viewLogs()" class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.8rem; opacity: 0.8; background-color: #64748B;">접속 로그 확인</button>
            <button onclick="logout()" class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.8rem; opacity: 0.8;">로그아웃</button>
        </div>

        <!-- Activity Log Modal -->
        <div id="activityLogModal" class="modal-overlay hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 20001; display: flex; align-items: center; justify-content: center;">
            <div class="modal-content" style="background: white; padding: 2rem; border-radius: 12px; width: 95%; max-width: 1100px; max-height: 90vh; position: relative; display: flex; flex-direction: column;">
                <button onclick="closeActivityLogModal()" style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #64748B;">&times;</button>
                <h3 style="margin-top: 0;">계획 수정/활동 로그</h3>
                <div id="activityLogContent" style="margin-top: 1rem; overflow-y: auto; flex-grow: 1;">
                    <table style="width: 100%; border-collapse: collapse; font-size: 0.9rem; table-layout: fixed;">
                        <thead style="background: #f1f5f9; position: sticky; top: 0; z-index: 10;">
                            <tr>
                                <th style="padding: 0.8rem 0.5rem; border: 1px solid #ddd; width: 20%;">일시</th>
                                <th style="padding: 0.8rem 0.5rem; border: 1px solid #ddd; width: 12%;">수정자</th>
                                <th style="padding: 0.8rem 0.5rem; border: 1px solid #ddd; width: 15%;">작업</th>
                                <th style="padding: 0.8rem 0.5rem; border: 1px solid #ddd; width: 43%;">상세 내용</th>
                                <th style="padding: 0.8rem 0.5rem; border: 1px solid #ddd; width: 10%;">IP</th>
                            </tr>
                        </thead>
                        <tbody id="activityLogTableBody"></tbody>
                    </table>
                </div>
                <div id="activityLogPagination" class="pagination-container" style="margin-top: 1rem; display: flex; justify-content: center; gap: 0.5rem;"></div>
            </div>
        </div>

        <!-- Log Modal -->
        <div id="logModal" class="modal-overlay hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 20000; display: flex; align-items: center; justify-content: center;">
            <div class="modal-content" style="background: white; padding: 2rem; border-radius: 12px; width: 95%; max-width: 900px; max-height: 85vh; position: relative; display: flex; flex-direction: column;">
                <button onclick="closeLogModal()" style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #64748B;">&times;</button>
                <h3 style="margin-top: 0;">시스템 접속 로그</h3>
                <div id="logContent" style="margin-top: 1rem; overflow-y: auto; flex-grow: 1;">
                    <table style="width: 100%; border-collapse: collapse; font-size: 0.9rem; table-layout: fixed;">
                        <thead style="background: #f1f5f9; position: sticky; top: 0; z-index: 10;">
                            <tr>
                                <th style="padding: 0.8rem 0.5rem; border: 1px solid #ddd; width: 35%;">일시</th>
                                <th style="padding: 0.8rem 0.5rem; border: 1px solid #ddd; width: 20%;">사용자</th>
                                <th style="padding: 0.8rem 0.5rem; border: 1px solid #ddd; width: 30%;">IP</th>
                                <th style="padding: 0.8rem 0.5rem; border: 1px solid #ddd; width: 15%;">결과</th>
                            </tr>
                        </thead>
                        <tbody id="logTableBody"></tbody>
                    </table>
                </div>
                <div id="logPagination" class="pagination-container" style="margin-top: 1rem; display: flex; justify-content: center; gap: 0.5rem;"></div>
            </div>
        </div>
            <div class="header-top">
                <h1>주간 정삭 계획 현황</h1>
                <div class="week-picker-container"
                    style="position: relative; display: inline-flex; align-items: center; gap: 10px;">
                    <label>기간 선택:</label>
                    <div class="week-picker-wrapper" style="position: relative;">
                        <!-- Custom text display -->
                        <div id="weekDisplay" class="week-display"
                            style="padding: 0.6rem 1rem; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main); font-weight: 500; cursor: pointer;">
                            로딩중...
                        </div>
                        <!-- Invisible native week input -->
                        <input type="date" id="weekPicker" class="week-picker">
                    </div>
                    <!-- Moved Manager Filter here -->
                    <div class="filter-group" style="margin-left: 10px;">
                        <label for="managerFilter" style="font-weight: 600; font-size: 0.9rem;">👤 담당자:</label>
                        <select id="managerFilter"
                            style="padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border-color); cursor: pointer; font-size: 0.9rem;">
                            <option value="">전체 항목</option>
                        </select>
                    </div>
                </div>
            </div>
            <p>각 장비별 계획을 입력하고 [통합 화면]에서 전체 현황을 확인하세요.</p>
        </header>

        <nav class="tabs-container">
            <ul id="equipmentTabs" class="tabs">
                <!-- Tabs will be injected here dynamically -->
            </ul>
        </nav>

        <main>
            <!-- Content for specific equipment -->
            <section id="planEditor" class="tab-content active">
                <div class="editor-header">
                    <h2 id="currentEquipmentTitle">장비명 로딩중...</h2>
                </div>

                <!-- Phase 18: Holiday Toggle UI -->
                <div class="holiday-section">
                    <div class="holiday-label">📅 장비 휴무일 설정 (휴무) :</div>
                    <div class="holiday-toggles" id="holidayToggles">
                        <button class="holiday-btn" data-day="fri">금</button>
                        <button class="holiday-btn" data-day="sat">토</button>
                        <button class="holiday-btn" data-day="sun">일</button>
                        <button class="holiday-btn" data-day="mon">월</button>
                        <button class="holiday-btn" data-day="tue">화</button>
                        <button class="holiday-btn" data-day="wed">수</button>
                        <button class="holiday-btn" data-day="thu">목</button>
                    </div>
                    <div style="font-size: 0.85rem; color: #666; margin-left: auto;">* 휴무로 선택된 요일은 계획 입력이 차단됩니다.</div>
                </div>

                <div class="table-card">
                    <div class="table-scroll-wrapper" style="height: 60vh;">
                        <table id="planTable">
                            <thead>
                                <tr>
                                    <th>NO</th>
                                    <th>담당자</th>
                                    <th>기종</th>
                                    <th>품명</th>
                                    <th>품번</th>
                                    <th id="thFri">금</th>
                                    <th id="thSat">토</th>
                                    <th id="thSun">일</th>
                                    <th id="thMon">월</th>
                                    <th id="thTue">화</th>
                                    <th id="thWed">수</th>
                                    <th id="thThu">목</th>
                                    <th>작업</th>
                                </tr>
                            </thead>
                            <tbody id="planTableBody">
                                <!-- Rows injected here -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="actions">
                    <button class="btn btn-secondary" id="addRowBtn">+ 행 추가</button>
                    <button class="btn btn-primary" id="saveBtn">✓ 계획 저장하기</button>
                </div>
            </section>

            <!-- Content for Consolidated View -->
            <section id="consolidatedView" class="tab-content">
                <div class="editor-header">
                    <h2>통합 화면 : 전체 주간 정삭 계획</h2>
                    <div class="filter-group" style="display: flex; gap: 0.5rem; align-items: center;">
                        <select id="equipmentConsFilter" class="btn btn-secondary" style="background: white; color: var(--text-main); border: 1px solid var(--border-color); height: 38px; padding: 0 10px;">
                            <option value="">전체 장비</option>
                        </select>
                        <button class="btn btn-warning" id="editModeBtn">✏️ 수정 모드</button>
                        <button class="btn btn-primary hidden" id="saveConsolidatedBtn">💾 변경사항 저장</button>
                        <button class="btn btn-success" id="exportExcelBtn">📥 엑셀 추출</button>
                        <button class="btn btn-secondary" id="refreshConsolidatedBtn">🔄 새로고침</button>
                    </div>
                </div>
                <div class="table-card" style="overflow: visible !important;">
                    <div class="table-scroll-wrapper">
                        <table id="consolidatedTable">
                            <thead>
                                <tr>
                                    <th style="width: 10%;">장비 (W/C)</th>
                                    <th style="width: 5%;">담당자</th>
                                    <th style="width: 10%;">기종</th>
                                    <th style="width: 14%;">품명</th>
                                    <th style="width: 14%;">품번</th>
                                    <th style="width: 3%;">중요도</th>
                                    <th style="width: 4%;">구분</th>
                                    <th id="thConsFri" style="width: 6.2%;">금</th>
                                    <th id="thConsSat" style="width: 6.4%;">토</th>
                                    <th id="thConsSun" style="width: 6.4%;">일</th>
                                    <th id="thConsMon" style="width: 6.4%;">월</th>
                                    <th id="thConsTue" style="width: 6.4%;">화</th>
                                    <th id="thConsWed" style="width: 6.4%;">수</th>
                                    <th id="thConsThu" style="width: 6.4%;">목</th>
                                </tr>
                            </thead>
                            <tbody id="consolidatedTableBody">
                                <!-- Rows injected here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>

        <!-- Toast Notification -->
        <div id="toast" class="toast hidden">저장되었습니다.</div>
    </div>

    <!-- SheetJS for Excel Export (Local Fallback for Intranet) -->
    <script src="js/xlsx.full.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
